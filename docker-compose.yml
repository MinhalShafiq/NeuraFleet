services:
  gateway:
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    container_name: neurafleet-gateway
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LIDAR_SERVICE_URL=http://lidar-service:8001
      - TELEMETRY_SERVICE_URL=http://telemetry-service:8002
      - RAG_SERVICE_URL=http://rag-service:8003
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      lidar-service:
        condition: service_started
      telemetry-service:
        condition: service_started
      rag-service:
        condition: service_started
    networks:
      - neurafleet-net
    restart: unless-stopped

  lidar-service:
    build:
      context: ./backend
      dockerfile: lidar_service/Dockerfile
    container_name: neurafleet-lidar
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    networks:
      - neurafleet-net
    restart: unless-stopped

  telemetry-service:
    build:
      context: ./backend
      dockerfile: telemetry_service/Dockerfile
    container_name: neurafleet-telemetry
    ports:
      - "8002:8002"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    networks:
      - neurafleet-net
    restart: unless-stopped

  rag-service:
    build:
      context: ./backend
      dockerfile: rag_service/Dockerfile
    container_name: neurafleet-rag
    ports:
      - "8003:8003"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CHROMA_DATA_DIR=/app/chroma_data
    volumes:
      - chroma_data:/app/chroma_data
    networks:
      - neurafleet-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile
    container_name: neurafleet-frontend
    ports:
      - "3000:8080"
    depends_on:
      - gateway
    networks:
      - neurafleet-net
    restart: unless-stopped

networks:
  neurafleet-net:
    driver: bridge

volumes:
  chroma_data:
    driver: local
