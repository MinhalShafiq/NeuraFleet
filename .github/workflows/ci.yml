name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/*/requirements.lock
            tests/requirements.txt
      # The same pinned set the images are built from.
      - run: |
          pip install \
            -r backend/gateway/requirements.lock \
            -r backend/lidar_service/requirements.lock \
            -r backend/telemetry_service/requirements.lock \
            -r backend/rag_service/requirements.lock \
            -r tests/requirements.txt
      - run: ruff check backend tests scripts
      - run: ruff format --check backend tests scripts
      - run: mypy backend --explicit-package-bases
      - run: pytest tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: terraform fmt + validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: kustomize build + kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # BackendConfig / ManagedCertificate are GKE CRDs without a public schema
          kubectl kustomize k8s/ | ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build every image (no push)
        run: docker compose build
