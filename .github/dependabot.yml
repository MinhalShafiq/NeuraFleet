version: 2
updates:
  # Python: bumps requirements.txt; regenerate the matching requirements.lock when merging
  # (uv pip compile backend/<svc>/requirements.txt -o backend/<svc>/requirements.lock ...)
  - package-ecosystem: pip
    directories:
      - /backend/gateway
      - /backend/lidar_service
      - /backend/telemetry_service
      - /backend/rag_service
    schedule: { interval: weekly }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend/dashboard
    schedule: { interval: weekly }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /backend/gateway
      - /backend/lidar_service
      - /backend/telemetry_service
      - /backend/rag_service
      - /frontend/dashboard
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /terraform
    schedule: { interval: weekly }
