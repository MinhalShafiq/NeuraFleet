[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "terraform", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line length is the formatter's job
    "B008",  # FastAPI uses function calls in defaults (Depends(), Query())
    "B905",  # zip(strict=) - lengths are equal by construction here
    "UP042",  # keep (str, Enum): StrEnum changes str() semantics
]

[tool.ruff.lint.isort]
known-first-party = ["shared"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["^tests/", "^frontend/", "^terraform/", "^\\.venv/"]
