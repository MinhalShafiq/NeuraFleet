# NeuraFleet MQTT broker (plan-messaging.md).
#
# Anonymous, unencrypted, plaintext TCP: fine for a local/demo stack where the broker
# is reachable only from the docker-compose network, not fine as-is for the public
# internet. A real deployment would add a password file (or client certificates) and
# TLS on a second listener - see the note at the bottom.

listener 1883
protocol mqtt

# No persistence needed: retained "status" messages matter for the life of the stack,
# not across a broker restart, and nothing here expects queued messages to survive one.
persistence false

allow_anonymous true

log_dest stdout
log_type error
log_type warning
log_type notice

# To require credentials instead of allow_anonymous:
#   mosquitto_passwd -c /mosquitto/config/passwd <user>
#   listener 1883
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
