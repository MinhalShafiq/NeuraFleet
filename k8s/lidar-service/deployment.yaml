apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidar-service
  namespace: neurafleet
  labels:
    app: lidar-service
    app.kubernetes.io/name: lidar-service
    app.kubernetes.io/part-of: neurafleet
    app.kubernetes.io/component: processing
spec:
  replicas: 1  # simulation state is in-process; >1 replica = divergent worlds
  selector:
    matchLabels:
      app: lidar-service
  template:
    metadata:
      labels:
        app: lidar-service
        app.kubernetes.io/name: lidar-service
        app.kubernetes.io/part-of: neurafleet
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: lidar-service
          image: gcr.io/PROJECT_ID/neurafleet-lidar-service:latest
          ports:
            - containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: neurafleet-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
