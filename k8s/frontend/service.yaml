apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: neurafleet
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: neurafleet
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    # The dashboard's /api/ws/ traffic crosses this backend too, so it needs the same long timeout.
    cloud.google.com/backend-config: '{"default": "long-lived-connections"}'
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
