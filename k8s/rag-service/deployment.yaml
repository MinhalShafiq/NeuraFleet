apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: neurafleet
  labels:
    app: rag-service
    app.kubernetes.io/name: rag-service
    app.kubernetes.io/part-of: neurafleet
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
        app.kubernetes.io/name: rag-service
        app.kubernetes.io/part-of: neurafleet
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # CPU-only: embeddings run on Chroma's ONNX MiniLM and generation is a remote API
      # call, so there is nothing for a GPU to do here (and no GPU request/toleration).
      containers:
        - name: rag-service
          image: gcr.io/PROJECT_ID/neurafleet-rag-service:latest
          ports:
            - containerPort: 8003
              protocol: TCP
          envFrom:
            - configMapRef:
                name: neurafleet-config
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neurafleet-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true  # without it the service answers from its rule-based fallback
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"   # ~205 MiB observed idle
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: chroma-data
              mountPath: /app/chroma_data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # the ONNX model is baked into the image; Chroma writes only to the PVC
            capabilities:
              drop:
                - ALL
      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: chroma-data-pvc
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data-pvc
  namespace: neurafleet
  labels:
    app: rag-service
    app.kubernetes.io/part-of: neurafleet
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
