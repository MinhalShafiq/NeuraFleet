apiVersion: v1
kind: ConfigMap
metadata:
  name: neurafleet-config
  namespace: neurafleet
  labels:
    app.kubernetes.io/part-of: neurafleet
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  # Browser origins allowed to call the gateway API directly (the dashboard itself uses same-origin /api)
  CORS_ORIGINS: "https://neurafleet.io"
  GATEWAY_URL: "http://gateway:8000"
  LIDAR_SERVICE_URL: "http://lidar-service:8001"
  TELEMETRY_SERVICE_URL: "http://telemetry-service:8002"
  RAG_SERVICE_URL: "http://rag-service:8003"
  CHROMA_DATA_DIR: "/app/chroma_data"
  # MQTT broker (plan-messaging.md): consumed by the gateway (commands), telemetry-service
  # (the fleet aggregator) and every robot-agent pod.
  MQTT_HOST: "mosquitto"
  MQTT_PORT: "1883"
